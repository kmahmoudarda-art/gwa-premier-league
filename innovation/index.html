<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWA Innovation Championship</title>
<meta name="description" content="GWA Innovation Championship — Tuesday 27 October 2026. The official guide to every competition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"><span></span></div>
<div class="progress" aria-hidden="true"></div>

<header class="nav">
  <a href="#/" class="brand" data-link>
    <span class="brand-mark"><i></i><i></i><i></i></span>
    <span>GWA<b>Innovation</b></span>
  </a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-actions">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark theme">◐</button>
    <button class="btn btn-solid magnetic" data-open-register><span>Teachers · Register</span></button>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
  </div>
</header>

<div class="wipe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<main id="app" tabindex="-1"></main>

<dialog id="register" class="register">
  <form method="dialog" class="reg-close"><button class="icon-btn" aria-label="Close">✕</button></form>
  <div class="reg-inner">
    <p class="eyebrow">Teachers only</p>
    <h2 class="reg-title">Join the Championship</h2>
    <p class="muted">Coach a team or judge a competition. Every judge receives a certificate of recognition.</p>
    <form id="regForm" class="reg-form">
      <fieldset class="role-pick">
        <legend>I want to register as</legend>
        <label><input type="radio" name="role" value="Coach" checked><span><b>Coach</b><small>Lead a student team</small></span></label>
        <label><input type="radio" name="role" value="Judge"><span><b>Judge</b><small>Score a competition</small></span></label>
      </fieldset>
      <label class="field"><span>Full name</span><input name="name" required autocomplete="name"></label>
      <label class="field"><span>School email</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Department / subject</span><input name="dept"></label>
      <label class="field"><span>Competition</span><select name="competition" id="regComp" required></select></label>
      <label class="field coach-only"><span>Team name &amp; student names</span><textarea name="team" rows="3" placeholder="Team name, then one student per line (name, year group)"></textarea></label>
      <label class="field"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>
      <button class="btn btn-solid btn-wide magnetic" type="submit"><span>Submit registration</span></button>
      <p class="reg-status" id="regStatus" role="status"></p>
    </form>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
